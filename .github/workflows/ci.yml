# Golden CI floor — see dotfiles/templates/ci/README.md.
# reparaturbonus-zh: pnpm + Drizzle. Gate = verify (format + lint + typecheck +
# tests) + a full production build. Drizzle has no codegen: types flow from
# src/lib/db/schema.ts at typecheck time. The build is hermetic: DB-backed
# pages (/admin, /dashboard) are `force-dynamic` and public pages fetch
# client-side, so `next build` needs no live DB — a dummy DATABASE_URL is
# enough (the db client is a lazy singleton that never connects at build).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # SSOT: format + lint + typecheck + tests, defined once in package.json `verify`.
      - name: Verify
        run: pnpm run verify

      # Full production build. Hermetic: no live DB needed (dummy DATABASE_URL
      # above). NEXTAUTH_* are dummies just to satisfy config resolution
      # during the build.
      - name: Build
        env:
          NEXTAUTH_SECRET: ci-dummy-secret
          NEXTAUTH_URL: http://localhost:3000
        run: pnpm run build
